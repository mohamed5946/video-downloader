# ONE-TIME workflow: generate the permanent SnapDL release keystore (v2).
# DELETE THIS FILE after the keystore is safely stored as a GitHub secret
# (KEYSTORE_BASE64) and backed up locally. Never commit a keystore.
#
# Why v2: the v1.0.2 keystore's KEY password does not match the
# KEY_PASSWORD secret (Gradle: "Get Key failed: Given final block not
# properly padded"), so it can never sign. The v1.0.2 key never signed a
# shipped release build (v1.0.2 is debug-signed), so replacing it costs
# nothing. This workflow PROVES both passwords work (jarsigner signs a
# dummy JAR with them) before the keystore is stored.
name: Generate release keystore v2 (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -keystore snapdl-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Mohamed El Sayed, OU=SnapDL, O=SnapDL, C=EG"
          keytool -list -v -keystore snapdl-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "Alias name|Owner:|SHA256:"
          echo "dummy" > dummy.txt
          jar cf dummy.jar dummy.txt
          # Proof both passwords work: jarsigner needs the store password
          # to open the keystore AND the key password to use the key.
          # Fails here (not in the real build) if either is wrong.
          jarsigner -keystore snapdl-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            dummy.jar "$KEY_ALIAS"
          jarsigner -verify dummy.jar

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: snapdl-release-keystore-v2
          path: snapdl-release.keystore
          if-no-files-found: error
