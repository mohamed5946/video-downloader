# ONE-TIME workflow: generate the permanent SnapDL release keystore.
# DELETE THIS FILE after the keystore is safely stored as a GitHub secret
# (KEYSTORE_BASE64) and backed up locally. Never commit a keystore.
name: Generate release keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore snapdl-release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Mohamed El Sayed, OU=SnapDL, O=SnapDL, C=EG"
          keytool -list -keystore snapdl-release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: snapdl-release-keystore
          path: snapdl-release.keystore
          if-no-files-found: error
