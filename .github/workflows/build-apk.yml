name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode release keystore
        # v1.0.2: ONE permanent keystore for all builds (secret
        # KEYSTORE_BASE64). Earlier builds used a fresh debug key per
        # runner, so v1.0.0 and v1.0.1 had different certificates and
        # Android refused updates between them.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # v1.0.3 fix: the Gradle root is android/android (where
          # settings.gradle.kts lives), and build.gradle.kts checks
          # rootProject.file("release.keystore") there. Decoding to
          # android/release.keystore (the Flutter project root) meant
          # the file was never found and every build silently fell back
          # to debug signing. Decode into the Gradle root instead.
          echo "$KEYSTORE_BASE64" | base64 -d > android/android/release.keystore
          ls -la android/android/release.keystore

      - name: Build release APK
        # v1.0.4: --no-shrink. Flutter's release build enables R8 code
        # shrinking/obfuscation by default, and R8 stripped a class the
        # download service needs at runtime (v1.0.3 field log:
        # NoClassDefFoundError "vr" — the obfuscated name of the missing
        # class; the dex contained zero occurrences of "YoutubeDL").
        # The APK is 178 MB of native engine anyway; shrinking saves
        # nothing worth this risk. Also disabled explicitly in
        # build.gradle.kts and guarded by proguard-rules.pro.
        # v1.0.2: UNIVERSAL APK again (all ABIs). v1.0.1 was an
        # arm64-only split APK and failed to install on the user's phone
        # ("package appears to be invalid") even after uninstalling
        # v1.0.0; the universal v1.0.0 installed fine. Plain
        # `flutter build apk --release` bundles all ABIs.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: cd android && flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapdl-release-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
