name: snapdl
description: "SnapDL — liquid-glass video downloader (yt-dlp engine) for Android."
publish_to: "none"
version: 1.0.2+2003

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  package_info_plus: ^8.1.1
  webview_flutter: ^4.13.0
  connectivity_plus: ^6.1.4
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
  assets:
    - assets/fonts/
    - assets/images/
    - assets/adblock-hosts.txt
