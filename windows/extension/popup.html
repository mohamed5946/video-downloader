<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px; padding: 16px;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    color: #1f2a33;
    background: #f7f4e9;
  }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head img { width: 38px; height: 38px; border-radius: 11px; }
  .head b { font-size: 17px; }
  .head span { display: block; font-size: 11px; color: rgba(31,42,51,.6); }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
    background: rgba(78,122,142,.1); border: 1px solid rgba(78,122,142,.3); margin-bottom: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b3261e; flex: none; }
  .dot.on { background: #2e7d5b; box-shadow: 0 0 8px #2e7d5b; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #4e7a8e, #3e6274);
    box-shadow: 0 8px 20px rgba(78,122,142,.4);
    margin-bottom: 10px;
  }
  button:active { transform: scale(.98); }
  label.row {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 12px; border-radius: 12px; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,.65); border: 1px solid rgba(78,122,142,.2);
  }
  label.row input { width: 16px; height: 16px; accent-color: #4e7a8e; }
  label.row small { display: block; color: rgba(31,42,51,.55); font-size: 11px; margin-top: 2px; }
  .msg { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: rgba(31,42,51,.75); min-height: 18px; }
  .blocked { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: #2e7d5b; text-align: center; }
  label.row { margin-bottom: 10px; }
  .foot { margin-top: 12px; font-size: 11px; color: rgba(31,42,51,.45); text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="SnapDL">
    <div><b>SnapDL</b><span id="headSub">Download with SnapDL</span></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking SnapDL…</span></div>
  <button id="sendPageBtn">Download this page's video</button>
  <label class="row">
    <input type="checkbox" id="interceptToggle">
    <span><span id="interceptLabel">Intercept browser downloads</span><small id="interceptSub">Send every browser download to SnapDL instead (IDM-style).</small></span>
  </label>
  <label class="row">
    <input type="checkbox" id="adblockToggle">
    <span><span id="adblockLabel">Ad Blocker</span><small id="adblockSub">Blocks ads in this browser (EasyList rules). YouTube video ads are not blocked.</small></span>
  </label>
  <div class="blocked" id="blockedLabel">— ads blocked</div>
  <div class="msg" id="msg"></div>
  <div class="foot" id="footNote">SnapDL desktop app must be running.<br>v1.0.0</div>
  <script src="popup.js"></script>
</body>
</html>
